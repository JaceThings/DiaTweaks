name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  make:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make
      # The wiki goes live after the code it documents merges, so a missing page warns instead of failing.
      - run: scripts/check-tweak-docs
        continue-on-error: true

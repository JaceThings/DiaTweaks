name: Bug
description: Something a patch broke or doesn't do right.
labels: [bug]
body:
  - type: checkboxes
    id: searched
    attributes:
      label: Already reported?
      options:
        - label: I searched open and closed issues and this bug isn't there yet
          required: true
        - label: It still happens on the latest DiaTweaks and Dia
          required: true
  - type: dropdown
    id: patch
    attributes:
      label: Which patch?
      multiple: true
      options:
        - Edge-to-Edge Web Pages
        - Square Corners Next to Sidebar
        - Hide Toolbar
        - Show Toolbar on Hover
        - Show Toolbar on New Tabs
        - Show Toolbar with Sidebar
        - Show Toast When Copying URL
        - Show Toolbar When Copying URL
        - Hide Site Color in Tab Bar
        - Always Show Address Field
        - Hide Chat Button
        - Hide Sidebar Button
        - Tidy Tabs
        - Profile Emoji
        - Translucent Sidebar
        - Compact Sidebar Header
        - Hide Chats Button
        - Hide Pinned Tab Border
        - Hide Recent Tabs Button
        - Don’t Open Downloads List
        - Close Tabs from Tab Switcher
        - Compact Command Bar
        - Compact with Chat Usage Too
        - Open New Tabs in Command Bar
        - Blur Page Behind
        - Darken Page Behind
        - Remember What You Typed
        - Hide Upgrade Banner
        - Window Material
        - Keep Windows Active
        - macOS 26 Window Corners
        - Hide Window Controls
        - Allow 1Password
        - Allow iCloud Passkeys
        - Allow iCloud Passwords
        - Group Tabs by Domain
        - Peek on Shift-Click
        - Patches pane in Settings
        - Installing, updating or restoring
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Screenshot or recording
      description: Drag it in here.
  - type: dropdown
    id: tabs
    attributes:
      label: Tabs
      options:
        - Sidebar
        - Top of window
        - Both
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Dia and macOS versions
      placeholder: Dia 1.55.1, macOS 26.1
    validations:
      required: true

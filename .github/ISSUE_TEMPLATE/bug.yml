name: Bug
description: Something a patch broke or doesn't do right.
labels: ["🐛 Bug"]
body:
  - type: checkboxes
    id: searched
    attributes:
      label: Already reported?
      options:
        - label: I searched open and closed issues and this bug isn't there yet
          required: true
        - label: It still happens on the latest DiaTweaks and Dia
          required: true
  - type: dropdown
    id: patch
    attributes:
      label: Which patch?
      multiple: true
      options:
        - Edge-to-Edge Web Pages
        - Square Corners Next to Sidebar
        - Hide Toolbar
        - Show Toolbar on Hover
        - Toggle toolbar visibility
        - Show Toolbar on New Tabs
        - Show Toolbar with Sidebar
        - Show Loading Progress
        - Show Toast When Copying URL
        - Show Toolbar When Copying URL
        - Hide Site Color in Tab Bar
        - Always Show Address Field
        - Hide Sidebar Button
        - Extensions Shortcut
        - Tidy Tabs
        - Profile Emoji
        - Switch Profiles with ⌘1–9
        - Translucent Sidebar
        - Compact Sidebar Header
        - Hide Pinned Tab Border
        - Hide Pinned Tab Card
        - Collapse Pinned Tabs
        - Hide Group Background
        - Hide Recent Tabs Button
        - Don’t Open Downloads List
        - Hide Site Not Working Prompt
        - Close Tabs from Tab Switcher
        - Unload Tabs
        - Undo Closing a Tab
        - Pin Tab Shortcut
        - Save Page As
        - Hide Sleeping Tabs
        - Compact Command Bar
        - Compact with Chat Usage Too
        - Open New Tabs in Command Bar
        - Blur Page Behind
        - Darken Page Behind
        - Shadow Behind Bar
        - Scroll Page Behind
        - Remember What You Typed
        - Hide History Suggestions
        - Hide New Tab Logo
        - Turn Off AI
        - Hide Chat Button
        - Hide Chats Button
        - Hide Upgrade Banner
        - Hide Personalize Button
        - Hide Skills Suggestions
        - Window Material
        - Keep Windows Active
        - Drag Window from Page
        - Window Corners
        - Hide Window Controls
        - Allow 1Password
        - Allow iCloud Passkeys
        - Allow iCloud Passwords
        - Group Tabs by Domain
        - Merge Subdomains
        - Peek on Shift-Click
        - Peek from Pinned Tabs
        - Drag Links to Peek
        - Hide Link Address
        - Little Dia
        - Close with Escape
        - Patches pane in Settings
        - Installing, updating or restoring
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Screenshot or recording
      description: Drag it in here.
  - type: dropdown
    id: tabs
    attributes:
      label: Tabs
      options:
        - Sidebar
        - Top of window
        - Both
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Dia and macOS versions
      placeholder: Dia 1.55.1, macOS 26.1
    validations:
      required: true
